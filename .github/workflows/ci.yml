name: CI et livraison

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  APP_ENV: test
  APP_SECRET: ci-placeholder-secret
  DATABASE_URL: mysql://app:ci-password@127.0.0.1:3306/sf74_ftapi?serverVersion=26.10.0&charset=utf8mb4
  FRANCE_TRAVAIL_CLIENT_ID: ci-placeholder
  FRANCE_TRAVAIL_CLIENT_SECRET: ci-placeholder

jobs:
  quality:
    name: Linters, analyse et sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: composer check-platform-reqs
      - run: composer audit --locked --no-interaction
      - run: composer lint
      - run: composer analyse

  tests:
    name: Tests PHP ${{ matrix.php }} / MySQL 26.10
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.12', '8.5']
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_DATABASE: sf74_ftapi_test
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: php bin/console importmap:install
      - run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - run: php bin/console doctrine:schema:validate --env=test
      - run: composer test -- --log-junit var/junit.xml
      - name: Rapport PHPUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.php }}
          path: var/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Configuration et construction Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - name: Validation du workflow
        run: >-
          docker run --rm
          --mount "type=bind,source=${GITHUB_WORKSPACE}/.github/workflows,target=/workflows,readonly"
          -w /workflows
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          ci.yml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: docker/php
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Construction et livraison de production
    needs: [quality, tests, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: bash tools/build-release.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: ft-api-${{ github.ref_name }}
          path: var/dist/ft-api.tar.gz*
          if-no-files-found: error
          retention-days: 30
